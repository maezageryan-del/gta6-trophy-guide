<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Platinum Docket — Leonida's sworn trophy record</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="strip">
  <div class="brand">
    <h1>The Platinum Docket</h1>
    <p class="sub">Leonida's sworn trophy record · GTA VI · every step an exhibit, every exhibit cited</p>
  </div>
  <div id="audit" class="audit" aria-live="polite">Filing the record…</div>
  <div class="tools">
    <input id="q" type="search" placeholder="Search cases, chapters, kinds…" aria-label="Search trophies">
    <div id="chips" class="chips" role="group" aria-label="Filters"></div>
    <div class="io">
      <button id="exportBtn" type="button">Export</button>
      <button id="importBtn" type="button">Import</button>
      <button id="resetBtn" type="button">Reset</button>
      <input id="importFile" type="file" accept="application/json" hidden>
    </div>
  </div>
  <nav class="tabs" aria-label="Docket sections">
    <button type="button" data-tab="docket" class="tab on">Docket</button>
    <button type="button" data-tab="roadmap" class="tab">Roadmap</button>
    <button type="button" data-tab="missables" class="tab">Missables</button>
    <button type="button" data-tab="next" class="tab">Next-Up</button>
    <button type="button" data-tab="sources" class="tab">Sources</button>
  </nav>
  <div id="progress" class="progress"></div>
</header>
<main id="main"></main>
<footer class="foot">The Platinum Docket — a sworn record, not a promise: trophy data as read from the dated sources in the register. Tracker state lives only in your browser.</footer>
<script src="app.js"></script>
</body>
</html>
